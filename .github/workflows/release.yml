name: release

# 仅在打 v* tag 时触发,不监听 pull_request —— 这条流水线会推送镜像/chart 到
# 生产仓库并创建 GitHub Release,不应该在 PR 上跑。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SWR_REGISTRY: swr.cn-north-4.myhuaweicloud.com
  SWR_PROJECT: modeldoctor

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(jq -r .version package.json)"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::tag ${TAG}(版本号 ${TAG_VERSION})与 package.json 的 version(${PKG_VERSION})不一致,拒绝发布 —— 避免镜像 tag 与代码版本脱节"
            exit 1
          fi
          echo "OK — tag ${TAG} matches package.json version ${PKG_VERSION}"
          echo "TAG_VERSION=${TAG_VERSION}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Log in to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.SWR_REGISTRY }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push app image (multi-arch)
        run: ./tools/build-app-image.sh --tag "${GITHUB_REF_NAME}" --push

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Rewrite Chart.yaml version/appVersion from tag
        run: |
          set -euo pipefail
          CHART_FILE="deploy/charts/modeldoctor/Chart.yaml"
          sed -i -E "s/^version: .*/version: ${TAG_VERSION}/" "$CHART_FILE"
          sed -i -E "s/^appVersion: .*/appVersion: \"${TAG_VERSION}\"/" "$CHART_FILE"
          echo "--- Chart.yaml after rewrite ---"
          cat "$CHART_FILE"

      - name: helm package
        run: |
          mkdir -p dist/release
          helm package deploy/charts/modeldoctor --destination dist/release

      - name: helm registry login (SWR OCI)
        run: |
          echo "${{ secrets.SWR_PASSWORD }}" | helm registry login "${{ env.SWR_REGISTRY }}" \
            --username "${{ secrets.SWR_USERNAME }}" --password-stdin

      - name: helm push chart to SWR
        run: helm push "dist/release/modeldoctor-${TAG_VERSION}.tgz" "oci://${{ env.SWR_REGISTRY }}/${{ env.SWR_PROJECT }}"

      - name: Generate offline image manifest for this release
        run: |
          set -euo pipefail
          sed -e "s/__APP_TAG__/${GITHUB_REF_NAME}/g" -e "s/__RUNNER_TAG__/${GITHUB_REF_NAME}/g" \
            deploy/offline/images.txt > "dist/release/modeldoctor-offline-images-${GITHUB_REF_NAME}.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/modeldoctor-${{ env.TAG_VERSION }}.tgz
            dist/release/modeldoctor-offline-images-${{ github.ref_name }}.txt
