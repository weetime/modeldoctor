# ModelDoctor Helm chart — default values.
#
# One image runs both the NestJS API and the built-in React SPA in a single
# Node process (port 3001, global prefix /api); the SPA is served only when
# NODE_ENV=production, which the chart always sets. Required env vars are
# validated with zod at process startup — the pod will CrashLoopBackOff (not
# just misbehave) if a required value is missing. Every boolean env var the
# app reads accepts ONLY the literal strings "true" / "false", so every
# boolean below is rendered through `ternary "true" "false" | quote` in the
# templates rather than relying on YAML's native bool -> string coercion.

nameOverride: ""
fullnameOverride: ""

image:
  registry: swr.cn-north-4.myhuaweicloud.com
  repository: modeldoctor/modeldoctor
  tag: ""            # 留空 = 使用 Chart.appVersion(由 release 流水线按 git tag 注入)
  pullPolicy: IfNotPresent
imagePullSecrets: []  # 私有 registry 才需要;不要在这里写死凭据,应引用集群里已存在的 imagePullSecret 名字

# 当前版本只支持单副本:通知派发、K8s watcher(Informer)、SSE Hub 均无选主机制,
# 多副本会导致重复通知与重复处理压测 Job。填 >1 会在渲染期直接失败(见
# modeldoctor.validate),而不是留到运行时才暴露成难以定位的重复行为。
replicaCount: 1

app:
  logLevel: info              # trace|debug|info|warn|error|fatal|silent
  disableFirstUserAdmin: false # true 则首个注册用户不再自动成为管理员(多用户/受控环境场景)
  baseUrl: ""                  # 留空则由 ingress.host + tls.enabled 推导(用于回调/邮件里的绝对链接)
  corsOrigins: ""               # 留空则同样由 ingress.host 推导;需要多来源时填逗号分隔的完整 origin 列表
  jwt:
    accessExpiresIn: 15m
    refreshExpiresDays: 7

service:
  type: ClusterIP
  port: 80                    # Service 对外端口;容器内应用固定监听 3001,不可更改

ingress:
  enabled: true
  className: nginx
  host: modeldoctor.local
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""
  # 默认注解针对 ingress-nginx:报告生成接口最长可跑到 ~180s,数据导入接口 body 可达 10MB,
  # 默认超时/body 上限会在正常使用中触发 504/413,因此提前放宽。
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"

auth:
  existingSecret: ""          # 提供则完全使用该 Secret(需自带下面三个 key),chart 不再生成/管理密钥
                               # key 名必须与容器环境变量名完全一致:JWT_ACCESS_SECRET、
                               # CONNECTION_API_KEY_ENCRYPTION_KEY、ALERTMANAGER_WEBHOOK_SECRET——
                               # 名字错了不会在渲染期报错,只会在容器启动时被 zod 校验拦下 CrashLoop。
  # 以下三项留空则首次安装时随机生成;升级时通过 `lookup` 读回已存在 Secret 里的值,
  # 保持不变——尤其是 connectionApiKeyEncryptionKey,一旦变化,数据库里已加密存储的
  # 第三方连接 API Key / LLM judge 密钥会全部无法解密(见 modeldoctor.keepOrGenerate)。
  jwtAccessSecret: ""
  connectionApiKeyEncryptionKey: ""   # 必须是 base64 字符串且解码后正好 32 字节
  alertmanagerWebhookSecret: ""

database:
  bundled: true               # true = chart 内置 Postgres StatefulSet;false = 连接外部数据库
  external:
    url: ""                   # postgresql://user:pass@host:5432/db?schema=public(bundled=false 时二选一)
    existingSecret: ""        # 或者提供一个已存在的 Secret,key 名见 existingSecretKey(bundled=false 时二选一)
                               # 用 existingSecret 时,chart 以 secretKeyRef 把 DATABASE_URL 直接注入容器,
                               # 不会把连接串写进 chart 自己生成的 Secret,也不经过 modeldoctor.databaseUrl。
    existingSecretKey: url
  postgres:
    image: postgres:16-alpine
    database: modeldoctor
    username: modeldoctor
    password: ""              # 留空自动生成并在升级时保持(同 auth 段的规则)
    persistence:
      enabled: true            # false 时退化为 emptyDir——仅用于临时验证,Pod 重建数据即丢失
      size: 20Gi
      storageClass: ""         # 留空使用集群默认 StorageClass
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 2Gi }

storage:
  bundled: true                # true = chart 内置 MinIO StatefulSet;false = 连接外部 S3 兼容存储
  bucket: modeldoctor
  region: us-east-1
  forcePathStyle: true         # MinIO 必须 true(虚拟主机风格域名不可用);阿里云 OSS / AWS S3 必须 false
  retentionDays: 30            # 建桶 Job 用它设置 mc ilm 生命周期规则,过期对象自动清理
  external:
    endpoint: ""
    accessKey: ""
    secretKey: ""
    existingSecret: ""        # 需同时含 accessKey / secretKey 两个 key(bundled=false 时,凭据二选一)。
                               # 注意(仅影响压测 Job):设置这个值后,chart 不会把这份凭据
                               # 复制进压测 Job 用的 md-benchmark-storage Secret——那个 Secret
                               # 要落在 benchmarks.namespace(压测 Job 跑在另一个命名空间),
                               # Kubernetes 的 Secret 之间没有 secretKeyRef 机制可以引用这里,
                               # 唯一能拿到真实值的办法是渲染期 `lookup` 再跨命名空间复制一份,
                               # 而 chart 选择不这么做(复制出的影子副本容易在凭据轮换后过期,
                               # 且 `lookup` 在 helm template/lint 等纯模板渲染路径下恒为空,
                               # 行为不可靠)。因此:使用 existingSecret 时,你需要自己在
                               # benchmarks.namespace 里也创建一个名字精确为
                               # md-benchmark-storage、包含 S3_ENDPOINT / S3_BUCKET / S3_REGION /
                               # S3_FORCE_PATH_STYLE / S3_ACCESS_KEY / S3_SECRET_KEY 六个明文 key
                               # 的 Secret,否则该命名空间里的压测 Job 会全部因认证失败而失败。
  minio:
    # 用 quay.io:MinIO 官方镜像在 Docker Hub 上这些 tag 已不可匿名拉取
    # (pull access denied),quay.io 正常。实测见 Task 7 报告。
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    mcImage: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    rootUser: modeldoctor
    rootPassword: ""           # 留空自动生成并保持(同 auth 段的规则)
    persistence:
      enabled: true
      size: 100Gi
      storageClass: ""
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "2", memory: 4Gi }

benchmarks:
  namespace: modeldoctor-benchmarks   # 压测 Job 运行在独立命名空间,与应用命名空间隔离资源与 RBAC 影响面
  createNamespace: true
  # off  = 不主动感知 Job 状态变化,靠轮询兜底都不做(不建议)
  # primary = 用 K8s Informer(pods:watch)实时感知——单副本前提下的推荐值
  # poll = 定时轮询,watch 权限不可用时的降级方案
  watcherMode: primary
  reconcileIntervalSec: 30
  orphanMinAgeSec: 60
  waitingFatalGraceSec: 60
  defaultMaxDurationSeconds: 1800
  defaultMaxConcurrency: 100
  # 启用的压测工具列表;每个值必须能在 runnerImages 里找到对应(非占位)镜像,
  # 否则 modeldoctor.validate 会在渲染期报错,而不是留到跑 Job 时才失败。
  enabledTools: [guidellm, vegeta]
  runnerImages:
    # 代码要求六个 RUNNER_IMAGE_* 环境变量全部非空,即使某个工具没启用也一样——
    # 未提供镜像的工具由 modeldoctor.runnerImage 注入占位镜像(modeldoctor.invalid/not-installed),
    # 只要该工具没出现在 enabledTools 里,占位镜像就不会被真正拉取/使用。
    guidellm: swr.cn-north-4.myhuaweicloud.com/modeldoctor/md-runner-guidellm:latest
    vegeta: swr.cn-north-4.myhuaweicloud.com/modeldoctor/md-runner-vegeta:latest
    evalscope: ""
    aiperf: ""
    tau3: ""
    vllmOmniBench: ""
  hf:
    endpoint: ""               # HuggingFace 镜像端点(留空用官方 hf.co)
    token: ""
    offline: false

prometheus:
  fetchAllowHosts: ""          # 逗号分隔的允许抓取的 Prometheus 主机白名单;留空不限制
  fetchBlockPrivate: false     # true 则拒绝抓取私有/内网地址(SSRF 防护;默认 false 因为集群内 Prometheus 本身就是内网地址)
  fetchMaxBodyBytes: 5242880

mcp:
  enabled: false
  bearerToken: ""              # enabled=true 时必填
  userId: ""                   # enabled=true 时必填
  allowExecute: true

resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { cpu: "2", memory: 2Gi }

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: ["ALL"] }
  readOnlyRootFilesystem: false   # Prisma 查询引擎在启动时会向临时目录写文件,只读根文件系统会导致启动失败
nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 120   # 报告生成等长任务需要足够的优雅关闭窗口,避免滚动更新中途打断

serviceAccount:
  create: true
  name: ""                     # 留空则使用 modeldoctor.fullname 生成的名字
  annotations: {}

test:
  # helm test(templates/tests/test-health.yaml)用来打 /api/health 的轻量 curl 镜像,
  # 与应用镜像无关(见该模板注释:测试本身只需要 curl,不需要背上应用镜像的体积和启动
  # 开销)。离线/私有化现场把所有镜像重打标签推到自有仓库后,这一个镜像也需要跟着改,
  # 否则集群拉不到 curlimages/curl 会导致 helm test 失败——改成你仓库里的地址即可,
  # 例如 <your-registry>/<project>/curl:8.11.1(离线交付包的 pull-and-save.sh 会把它纳入
  # 清单一并打包)。
  image: curlimages/curl:8.11.1
