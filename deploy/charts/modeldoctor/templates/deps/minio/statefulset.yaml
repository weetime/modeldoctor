{{- /*
  仅在内置 MinIO 时渲染(storage.bundled=true)。

  单节点单驱动模式(`minio server /data`,不是 distributed 多节点纠删码部署):压测报告
  对象存储不需要 MinIO 的多节点高可用,单副本 + PVC 持久化足够,与内置 Postgres 走同样
  的取舍(见 deps/postgres/statefulset.yaml 的说明)。

  `--console-address :9001` 必须显式指定:不写的话 MinIO 会随机挑一个端口暴露 Console,
  下面 Service 里固定的 targetPort: console(9001)就会连不上。

  健康检查路径是 MinIO 官方文档指定的两个端点,都在 9000(S3 API 端口)上,不在 9001
  (Console 端口):
    readiness: /minio/health/ready —— 就绪后才把 Pod 加入 Service Endpoints;
    liveness:  /minio/health/live  —— 存活探测,失败则重启容器。
  bucket-init Job(jobs/bucket-init.yaml)不依赖这个 readiness gate,它用应用层的
  `until mc alias set ...` 重试循环等待 MinIO 就绪,双重保险。

  密码来自 secret.yaml 渲染的 <fullname>-minio Secret 的 rootPassword 字段(由
  modeldoctor.minioRootPassword 生成并跨 upgrade 保持不变),不直接内联 Values 里的值——
  这样即便 storage.minio.rootPassword 后续在 values 里留空,StatefulSet、api Secret 的
  S3_SECRET_KEY、以及 benchmarks 命名空间的 S3_SECRET_KEY 三边算出的都始终是同一个
  Secret 里的同一份值。

  securityContext 复用 values.yaml 全局约定的 uid/gid 1000(与 podSecurityContext 默认值
  一致,不是为 MinIO 新发明一套);官方 minio/minio 镜像不要求特定 uid,只要 /data 挂载点
  可写、镜像内二进制可执行即可,fsGroup 确保 PVC 卷对该 uid 可写。

  storage.minio.persistence.enabled=false 时用 emptyDir 兜底(仅用于临时验证——Pod 重建/
  滚动更新数据即丢失),处理方式与 Postgres 完全一致。
*/ -}}
{{- if .Values.storage.bundled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "modeldoctor.minio.fullname" . }}
  labels: {{- include "modeldoctor.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "modeldoctor.minio.fullname" . }}
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {{- include "modeldoctor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels: {{- include "modeldoctor.labels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: minio
          image: {{ .Values.storage.minio.image }}
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.storage.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "modeldoctor.minio.fullname" . }}
                  key: rootPassword
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.storage.minio.resources | nindent 12 }}
      {{- if not .Values.storage.minio.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.storage.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "modeldoctor.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.storage.minio.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.minio.persistence.size }}
  {{- end }}
{{- end }}
