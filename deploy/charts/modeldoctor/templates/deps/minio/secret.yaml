{{- /*
  仅在内置 MinIO 时渲染(storage.bundled=true)。密码字段名固定为 "rootPassword"——
  modeldoctor.minioRootPassword(见 _helpers.tpl)按这个 Secret 名字(modeldoctor.minio.fullname)
  和这个 key 做 lookup,升级时把已经落盘的值读回来,而不是重新生成。这里、
  statefulset.yaml 的 MINIO_ROOT_PASSWORD、api Secret 里的 S3_SECRET_KEY、以及
  benchmarks 命名空间 md-benchmark-storage 的 S3_SECRET_KEY(三处都经由
  modeldoctor.storageSecretKey -> modeldoctor.minioRootPassword 算出)必须是完全相同的
  一个值——任何一处的 Secret 名字或 key 名对不上,upgrade 都会让某一处悄悄生成新密码,
  API/压测 Job 到 MinIO 的连接立刻失配。这正是 Task 6 里 Postgres 密码曾经出现过的缺陷,
  这里复用同一个 modeldoctor.keepOrGenerate 助手,并在单次渲染内记忆化,确保一致。
*/ -}}
{{- if .Values.storage.bundled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modeldoctor.minio.fullname" . }}
  labels: {{- include "modeldoctor.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
type: Opaque
data:
  rootPassword: {{ include "modeldoctor.minioRootPassword" . | b64enc }}
{{- end }}
