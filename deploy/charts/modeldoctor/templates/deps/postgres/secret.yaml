{{- /*
  仅在内置 Postgres 时渲染(database.bundled=true)。密码字段名固定为 "password"——
  modeldoctor.postgresPassword(见 _helpers.tpl)按这个 Secret 名字(modeldoctor.postgres.fullname)
  和这个 key 做 lookup,升级时把已经落盘的值读回来,而不是重新生成。这里、
  statefulset.yaml 的 POSTGRES_PASSWORD、以及 api Secret 里的 DATABASE_URL
  (modeldoctor.databaseUrl,同样调用 modeldoctor.postgresPassword)三处必须算出完全
  相同的密码——任何一处的 Secret 名字或 key 名对不上,upgrade 都会让某一处悄悄生成
  新密码,数据库连接立刻失配。
*/ -}}
{{- if .Values.database.bundled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modeldoctor.postgres.fullname" . }}
  labels: {{- include "modeldoctor.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # 【不要摘掉】`helm uninstall` 不删这个 Secret —— 它必须跟着 PVC 一起活下来。
    # Postgres 镜像只在**初始化一个空 PGDATA** 时才使用 POSTGRES_PASSWORD;PVC 在
    # uninstall 后按设计留存,里面的 PGDATA 已经初始化过,重装时新生成的密码对它完全
    # 无效。症状是 wait-for-db initContainer 一路重试到超时预算耗尽后失败,而报错
    # 只是"连不上数据库",完全指不到"密码是新生成的"这个真实原因。
    # 详见 api/secret.yaml 上同一条注解的说明,以及 README 的「卸载」一节。
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ include "modeldoctor.postgresPassword" . | b64enc }}
{{- end }}
