# 该 Secret 始终渲染(Task 4 接口约定:Secret <fullname>-secrets 是稳定产物)。
#
# auth.existingSecret 只替换三个由 modeldoctor.keepOrGenerate 管理、跨 upgrade 必须保持
# 不变的字段(JWT_ACCESS_SECRET / CONNECTION_API_KEY_ENCRYPTION_KEY /
# ALERTMANAGER_WEBHOOK_SECRET)。设置后这三个 key 在这里完全不出现——不生成、不
# lookup、不写入这个 Secret;运维明确表示要自己管的密钥就不应该在集群里再存一份。
# 这三个值改由 deployment.yaml 额外挂一个指向该 existingSecret 的 envFrom 注入(该
# Secret 需自带同名的三个 key,见 values.yaml:57 附近的说明),与这里的 data 完全
# 独立、不存在“谁覆盖谁”的顺序依赖。DATABASE_URL / S3 凭据仍然走这个 Secret,除非
# database.external.existingSecret / storage.external.existingSecret 各自选择了
# 独立的 secretKeyRef 注入路径(见 deployment.yaml),此时这里对应字段被跳过,避免
# 把空值或重复的凭据写进两个地方。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modeldoctor.secretName" . }}
  labels: {{- include "modeldoctor.labels" . | nindent 4 }}
  annotations:
    # 【不要摘掉】`helm uninstall` 不删这个 Secret。理由是 chart 的持久化边界不对称:
    # PVC(Postgres/MinIO 数据)与 benchmarks 命名空间按设计会在 uninstall 后留存,
    # 但 Secret 默认会被删掉。真正的后果发生在"uninstall 之后重装到同一个命名空间"
    # 这条很常见的运维路径上——keepOrGenerate 的 lookup 找不到旧 Secret,会生成一个
    # 全新的 CONNECTION_API_KEY_ENCRYPTION_KEY,而幸存的 Postgres 卷里存着用旧密钥
    # 加密的全部第三方连接 API Key / LLM judge 密钥:它们会永久无法解密,且没有任何
    # 报错,只在用户实际去调用那些连接时才炸。DATABASE_URL 里的内置 Postgres 密码同理
    # (见 deps/postgres/secret.yaml 的说明)。
    #
    # keep 只影响删除,不影响更新:`helm upgrade` 仍然照常 patch 这个 Secret
    # (CI 的 "helm upgrade 可重入" 断言覆盖了这一点)。重装时 Helm 会按对象上残留的
    # meta.helm.sh/release-name|namespace 注解认领它——前提是 release 名与命名空间
    # 都和上次一致;不一致会明确报 "invalid ownership metadata" 而不是静默出错。
    # 真正要彻底清库时的手工清理步骤写在 README 的「卸载」一节。
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if not .Values.auth.existingSecret }}
  {{- /* "key" 必须是这个 Secret 里实际的 data 字段名(SCREAMING_SNAKE),不是
     values.yaml 里的 camelCase 名字——keepOrGenerate 用它去 lookup 既有 Secret 的
     data[.key],传错(比如传 "jwtAccessSecret")会让 lookup 永远查不到,每次
     upgrade 都悄悄重新生成,详见 _helpers.tpl 里 keepOrGenerate 定义处的说明。 */}}
  JWT_ACCESS_SECRET: {{ include "modeldoctor.keepOrGenerate" (dict "ctx" . "key" "JWT_ACCESS_SECRET" "value" .Values.auth.jwtAccessSecret "len" 48) | b64enc }}
  # 代码要求该值本身就是一个 base64 字符串且解码后正好 32 字节;keepOrGenerate(kind=b64-32)
  # 的输出已经是这样的字符串,这里的 b64enc 是 K8s Secret data 字段本身要求的那一层编码,
  # 不要漏加也不要多加——最终落在 Secret 里的是 base64(base64(32 字节)),没有多余换行。
  CONNECTION_API_KEY_ENCRYPTION_KEY: {{ include "modeldoctor.keepOrGenerate" (dict "ctx" . "key" "CONNECTION_API_KEY_ENCRYPTION_KEY" "value" .Values.auth.connectionApiKeyEncryptionKey "kind" "b64-32") | b64enc }}
  ALERTMANAGER_WEBHOOK_SECRET: {{ include "modeldoctor.keepOrGenerate" (dict "ctx" . "key" "ALERTMANAGER_WEBHOOK_SECRET" "value" .Values.auth.alertmanagerWebhookSecret "len" 48) | b64enc }}
  {{- end }}
  {{- if not (and (not .Values.database.bundled) .Values.database.external.existingSecret) }}
  DATABASE_URL: {{ include "modeldoctor.databaseUrl" . | b64enc }}
  {{- end }}
  {{- if not (and (not .Values.storage.bundled) .Values.storage.external.existingSecret) }}
  S3_ACCESS_KEY: {{ include "modeldoctor.storageAccessKey" . | b64enc }}
  S3_SECRET_KEY: {{ include "modeldoctor.storageSecretKey" . | b64enc }}
  {{- end }}
  {{- with .Values.benchmarks.hf.token }}
  RUNNER_HF_TOKEN: {{ . | b64enc }}
  {{- end }}
  {{- if .Values.mcp.enabled }}
  MCP_BEARER_TOKEN: {{ .Values.mcp.bearerToken | b64enc }}
  MCP_USER_ID: {{ .Values.mcp.userId | b64enc }}
  {{- end }}
