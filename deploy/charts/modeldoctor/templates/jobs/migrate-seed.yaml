{{- /*
  数据库迁移 + seed 的 pre-install/pre-upgrade hook Job。

  hook 选择:
    - "pre-install,pre-upgrade":两个阶段都要跑——全新安装需要建表 + 灌内置数据;每次
      upgrade 也必须重新跑,因为 seed.ts 里的 upsert 是幂等的"确保内置评测集 / 官方压测
      模板与代码里的最新定义一致"的操作,不是一次性初始化(见仓库 CLAUDE.md「Seeding
      内置/官方内容」一节:`prisma migrate deploy` 本身不自动 seed,部署流程必须显式
      调用 seed 脚本)。
    - hook-weight "-10":比 bucket-init(weight "0")更早跑,并且早于任何非 hook 资源
      (api Deployment 没有 hook 注解,按 Helm 默认时机创建)——API 进程启动时直接连库
      查询,若表还没建好会直接 CrashLoop,所以迁移必须在 Deployment 创建之前完成。
    - hook-delete-policy "before-hook-creation"(而不是 "hook-succeeded"):失败的迁移
      Job 要保留到下一次 install/upgrade 之前,便于 `kubectl logs` 排障——这是 Task 7
      (bucket-init)踩过并修复的同一类坑在这里的对应选择:`hook-succeeded` 只在成功时
      删除,乍看好像没问题,但会让人误以为"删除策略与失败排障无关"而顺手换成更激进的
      策略;这里明确写成 before-hook-creation,失败现场保留到下一次 release 触发前。

  等待数据库就绪(initContainer wait-for-db):有限次数重试(60 次 × 5s = 最多等 300s),
  超时显式 `exit 1`,不是永不退出的裸循环——bucket-init 的等待逻辑最初就是这个坑,已在
  Task 7 里改成有限重试,这里从一开始就照该 house pattern 写。等待手段是
  `prisma db execute --url "$DATABASE_URL" --stdin` 喂 `SELECT 1;`——已用本地构建的镜像
  (node 20-alpine,prisma 6.19.3)实测确认该子命令与参数组合可用,且在数据库不可达时
  返回非零退出码(P1001),数据库可达时返回退出码 0(见 Task 8 报告的验证记录),不需要
  退化到「重试 migrate deploy 本身」这条备选路径。

  Job 级别的 activeDeadlineSeconds 300(等待数据库就绪的上限)+ 300(migrate deploy +
  seed 的操作余量,两者通常是秒级,但给足冗余应对大版本迁移或校验较慢的场景)= 600,
  防止数据库长期不可用时 Job 无限期占用 release 命名空间——与 bucket-init 的
  activeDeadlineSeconds 双重兜底是同一个思路。

  DATABASE_URL 的来源分两种情形:
    - database.bundled=true,或 database.bundled=false 且提供了 database.external.url:
      chart 自己的 Secret(<fullname>-secrets)里有 DATABASE_URL 这个 key,靠下面的
      envFrom secretRef 就能拿到,不需要额外处理。
    - database.bundled=false 且提供了 database.external.existingSecret:chart 自己的
      Secret 完全不写 DATABASE_URL 这个 key(见 templates/api/secret.yaml 的对应
      if 分支),必须像 templates/api/deployment.yaml 一样,用显式的
      env[].valueFrom.secretKeyRef 直接指向那个既有 Secret——不能调用
      `modeldoctor.databaseUrl`(该 helper 在这条路径上会直接 `fail`,见 _helpers.tpl
      里的说明),也不能指望 envFrom 能从一个根本没有这个 key 的 Secret 里生效。
      wait-for-db 与 migrate-seed 两个容器都要加这层覆盖,因为两者都是通过进程环境变量
      $DATABASE_URL 读取连接串的(prisma schema.prisma 的 datasource url,与 shell 脚本
      里手写的 "$DATABASE_URL",是同一个环境变量)。
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "modeldoctor.fullname" . }}-migrate
  labels: {{- include "modeldoctor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    # 失败的 Job 保留到下一次 install/upgrade 之前,便于 kubectl logs 排障(见上方说明,
    # 对应 Task 7 bucket-init 修过的同一类坑——不要改成 hook-succeeded)。
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  # 300s(等待数据库就绪的重试上限:60 次 × 5s)+ 300s(migrate deploy + seed 的操作
  # 余量),防止数据库长期不可用时 Job 无限期占用 release 命名空间,见上方注释。
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: {{- include "modeldoctor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-db
          image: {{ include "modeldoctor.image" . }}
          command:
            - sh
            - -c
            - |
              # 等数据库可连。必须直接调二进制:以非 root 的 app 用户运行时
              # `pnpm exec` 会让 Corepack 重装 pnpm 并因 node_modules 属 root 失败。
              cd /app/apps/api
              for i in $(seq 1 60); do
                if echo 'SELECT 1;' | node_modules/.bin/prisma db execute --url "$DATABASE_URL" --stdin >/dev/null 2>&1; then exit 0; fi
                echo "waiting for database... ($i/60)"; sleep 5
              done
              echo "数据库在 5 分钟内未就绪" >&2; exit 1
          envFrom:
            - secretRef: { name: {{ include "modeldoctor.secretName" . }} }
          {{- if and (not .Values.database.bundled) .Values.database.external.existingSecret }}
          env:
            # database.external.existingSecret 模式:DATABASE_URL 不在 chart 自己的 Secret
            # 里,必须从既有 Secret 直接注入——与 templates/api/deployment.yaml 完全一致
            # 的处理方式,见文件头部的说明。
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.external.existingSecret }}
                  key: {{ .Values.database.external.existingSecretKey }}
          {{- end }}
      containers:
        - name: migrate-seed
          image: {{ include "modeldoctor.image" . }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> prisma migrate deploy"
              cd /app/apps/api   # prisma 按 cwd 找 prisma/schema.prisma
              node_modules/.bin/prisma migrate deploy
              echo "==> prisma db seed (幂等 upsert:内置评测集 + 官方压测模板)"
              # 不走 `prisma db seed` 包装:它 fork 的 shell 里 tsx 不在 PATH 上
              node_modules/.bin/tsx prisma/seed.ts
          envFrom:
            - configMapRef: { name: {{ include "modeldoctor.fullname" . }}-config }
            - secretRef: { name: {{ include "modeldoctor.secretName" . }} }
          {{- if and (not .Values.database.bundled) .Values.database.external.existingSecret }}
          env:
            # 同上:existingSecret 模式下 migrate/seed 也要直接从既有 Secret 拿 DATABASE_URL。
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.external.existingSecret }}
                  key: {{ .Values.database.external.existingSecretKey }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
