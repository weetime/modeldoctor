{{- /*
  压测 Job 在另一个命名空间(benchmarks.namespace)运行,每个 Job 都通过 envFrom 挂载一个
  名字硬编码为 md-benchmark-storage 的 Secret(见 benchmark/k8s/k8s-job-manifest.ts 里的
  STORAGE_SECRET_NAME 常量,chart 侧不可改名,否则每个压测 Job 都会启动即失败)。

  storage.external.existingSecret(外接 S3 + 运维自管凭据、不要 chart 生成/持有一份)在这里
  没有等价物可用:Kubernetes 的 Secret 对象之间没有 secretKeyRef 机制——Deployment/Pod 能用
  secretKeyRef 从另一个 Secret 取值(见 api/deployment.yaml 里 storage.external.existingSecret
  的用法),但 Secret 的 data/stringData 字段做不到"引用另一个 Secret"。要在这里拿到真实
  凭据只剩两条路:
    (a) chart 在渲染期用 `lookup` 读出用户那个 existingSecret 的内容,再复制进
        md-benchmark-storage——这是一次跨命名空间的凭据物理复制,而且 `lookup` 只在真正的
        `helm upgrade/install`(连了实际集群)时才有值,`helm template`/`helm lint`/多数
        GitOps 工具默认走的纯模板渲染路径下恒为空,行为随渲染方式漂移、不可预测;
    (b) chart 完全不在这种模式下渲染 md-benchmark-storage,改为要求运维自己在
        benchmarks.namespace 里也放一份同名同 key 的 Secret。

  这里选择 (b):storage.external.existingSecret 非空时本模板不渲染任何东西。理由——
  运维选 existingSecret 这条路径本身就表达了"这份凭据我自己管,不要 chart 在集群里
  再存一份"(参见 api/secret.yaml 对 auth.existingSecret 的同一立场);(a) 的"自动复制"
  表面上省事,实际上是 chart 悄悄弄出一份运维不知情、容易在凭据轮换后过期的影子副本,
  而且依赖 `lookup` 在不同渲染路径下不一致的行为,比要求运维多建一个 Secret 更不可靠。
  这个选择的后果已经写进 values.yaml 里 storage.external.existingSecret 的注释:运维必须
  自己在 benchmarks.namespace 里创建一个名字精确为 md-benchmark-storage、包含下面全部
  6 个明文 key 的 Secret,否则该命名空间里的压测 Job 会因为拿不到存储凭据而全部失败。
*/ -}}
{{- if not (and (not .Values.storage.bundled) .Values.storage.external.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  # 名字由代码硬编码(benchmark/k8s/k8s-job-manifest.ts: STORAGE_SECRET_NAME),不可改。
  name: md-benchmark-storage
  namespace: {{ .Values.benchmarks.namespace }}
  labels: {{- include "modeldoctor.labels" . | nindent 4 }}
type: Opaque
data:
  # 内置 MinIO 时 modeldoctor.storage.endpoint 始终返回集群内 FQDN
  # (http://<svc>.<release-ns>.svc.cluster.local:9000)而不是短服务名——压测 Job 跑在
  # benchmarks.namespace,跨命名空间时短名字不可解析,必须用 FQDN;外接 S3 时原样透传
  # storage.external.endpoint,不做任何改写。
  S3_ENDPOINT: {{ include "modeldoctor.storage.endpoint" . | b64enc }}
  S3_BUCKET: {{ .Values.storage.bucket | b64enc }}
  S3_REGION: {{ .Values.storage.region | b64enc }}
  S3_FORCE_PATH_STYLE: {{ .Values.storage.forcePathStyle | ternary "true" "false" | b64enc }}
  S3_ACCESS_KEY: {{ include "modeldoctor.storageAccessKey" . | b64enc }}
  S3_SECRET_KEY: {{ include "modeldoctor.storageSecretKey" . | b64enc }}
{{- end }}
