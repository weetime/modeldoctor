# RBAC required by the ModelDoctor API to manage benchmark Jobs.
#
# Scope: namespace-bound (modeldoctor-benchmarks). No cluster-wide perms.
# The API runs as ServiceAccount modeldoctor-api in namespace `modeldoctor`
# (rename to match your actual API namespace before applying).
#
# NOTE: 这份手工清单已被 Helm chart(deploy/charts/modeldoctor)取代，仅供不使用 Helm 的
# 部署参考。K8S_WATCHER_MODE=primary(默认)的 Informer 需要 pods:watch —— 缺了会 CrashLoop。

apiVersion: v1
kind: Namespace
metadata:
  name: modeldoctor-benchmarks
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: modeldoctor-api
  namespace: modeldoctor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: modeldoctor-benchmark-driver
  namespace: modeldoctor-benchmarks
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: modeldoctor-benchmark-driver
  namespace: modeldoctor-benchmarks
subjects:
  - kind: ServiceAccount
    name: modeldoctor-api
    namespace: modeldoctor
roleRef:
  kind: Role
  name: modeldoctor-benchmark-driver
  apiGroup: rbac.authorization.k8s.io
